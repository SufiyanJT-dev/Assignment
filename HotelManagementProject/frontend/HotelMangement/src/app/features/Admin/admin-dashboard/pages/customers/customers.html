<div class="mat-toolbar">
 

<table mat-table [dataSource]="filtered" class="mat-elevation-z1" style="width:100%; margin-top:12px;">
  <ng-container matColumnDef="fullName">
    <th mat-header-cell *matHeaderCellDef> Name </th>
    <td mat-cell *matCellDef="let c"> {{c.fullName}} </td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef> Email </th>
    <td mat-cell *matCellDef="let c"> {{c.email}} </td>
  </ng-container>

  <ng-container matColumnDef="phoneNumber">
    <th mat-header-cell *matHeaderCellDef> Phone </th>
    <td mat-cell *matCellDef="let c"> {{c.phoneNumber}} </td>
  </ng-container>

  <ng-container matColumnDef="idProofNumber">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let c"> {{c.idProofNumber}} </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> </th>
    <td mat-cell *matCellDef="let c">
      <button mat-stroked-button color="primary"></button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="['fullName','email','phoneNumber','idProofNumber','actions']"></tr>
  <tr mat-row *matRowDef="let row; columns: ['fullName','email','phoneNumber','idProofNumber','actions'];"></tr>
</table>
