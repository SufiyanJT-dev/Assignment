<app-navbar></app-navbar>
<mat-card class="profile-card">
  <mat-card-header>
    <div mat-card-avatar class="profile-avatar">
      <mat-icon>person</mat-icon>
    </div>
    <mat-card-title>{{ userData.fullName }}</mat-card-title>
    <mat-card-subtitle>User Profile</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <mat-divider></mat-divider>
    <div class="profile-detail">
      <mat-icon color="primary">email</mat-icon>
      <span>{{ userData.email }}</span>
    </div>
    <div class="profile-detail">
      <mat-icon color="primary">phone</mat-icon>
      <span>{{ userData.phoneNumber }}</span>
    </div>
    <div class="profile-detail">
      <mat-icon color="primary">badge</mat-icon>
      <span>{{ userData.idProofNumber }}</span>
    </div>
  </mat-card-content>

  <mat-card-actions align="end">
    <button mat-raised-button color="warn" (click)="Logout()">Logout</button>
  </mat-card-actions>
</mat-card>
